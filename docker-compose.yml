version: '3.8'

# Eparv production stack: Next.js app + PostgreSQL.
# Usage: docker compose up -d --build
# The app listens on port 3000; put Nginx (with HTTPS) in front per DEPLOYMENT.md.

services:
  eparv:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_ADAPTER: postgres
      DATABASE_URL: postgresql://eparv:${POSTGRES_PASSWORD}@postgres:5432/eparv
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      CRON_SECRET: ${CRON_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eparv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eparv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eparv']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
